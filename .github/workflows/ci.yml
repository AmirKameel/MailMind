name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AUTH_SECRET: "dummy-test-secret-not-real-32bytes-padding-pad"
  CREDENTIAL_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mailmind_test"
  GOOGLE_CLIENT_ID: "ci-stub"
  GOOGLE_CLIENT_SECRET: "ci-stub"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  verify:
    name: Verify (typecheck + lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e:install
      - run: npm run build
      - run: npx playwright test
        env:
          E2E_BASE_URL: ""
